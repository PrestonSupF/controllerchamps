<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs - Admin Control Panel</title>
    <!-- Firebase App (Core SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #121216;
            color: #ffffff;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 600px;
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #ffaa00;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .match-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-row {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Displays RAW name with dot on control panel */
        .raw-name {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            color: #aaa;
        }

        .value-display {
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-controls {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            background: #ffaa00;
            color: #111;
            border: none;
            padding: 8px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #ffbb22;
        }

        button.decrement {
            background: #333;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button.decrement:hover {
            background: #444;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Controller Champs Admin</h1>
        <div class="match-card">
            
            <!-- Player 1 Control -->
            <div class="player-row">
                <div class="player-header">
                    <span class="player-title">Player 1 (Raw Name shown)</span>
                    <span id="ctrl-p1-name" class="raw-name">Waiting...</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Live HP</label>
                        <div id="ctrl-p1-hp" class="value-display">20 / 20</div>
                    </div>
                    <div class="stat-box">
                        <label>Score Control</label>
                        <div class="score-controls">
                            <button class="decrement" onclick="adjustScore('p1Score', -1)">-</button>
                            <button onclick="adjustScore('p1Score', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="stat-box" style="margin-top: 4px;">
                    <label>Current Score: <span id="ctrl-p1-score-val" style="color: #ffaa00;">0</span></label>
                </div>
            </div>

            <!-- Player 2 Control -->
            <div class="player-row">
                <div class="player-header">
                    <span class="player-title">Player 2 (Raw Name shown)</span>
                    <span id="ctrl-p2-name" class="raw-name">Waiting...</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Live HP</label>
                        <div id="ctrl-p2-hp" class="value-display">20 / 20</div>
                    </div>
                    <div class="stat-box">
                        <label>Score Control</label>
                        <div class="score-controls">
                            <button class="decrement" onclick="adjustScore('p2Score', -1)">-</button>
                            <button onclick="adjustScore('p2Score', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="stat-box" style="margin-top: 4px;">
                    <label>Current Score: <span id="ctrl-p2-score-val" style="color: #ffaa00;">0</span></label>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Firebase Configuration for champs-6c8c8
        const firebaseConfig = {
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('matchState');

        // Listen for real-time updates and display RAW names (retaining dots)
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Player 1 - Raw name preserved
            const p1Name = data.p1Name || "Waiting...";
            const p1Hp = data.p1Hp !== undefined ? data.p1Hp : 20;
            const p1Score = data.p1Score !== undefined ? data.p1Score : 0;

            document.getElementById('ctrl-p1-name').innerText = p1Name;
            document.getElementById('ctrl-p1-hp').innerText = `${p1Hp} / 20`;
            document.getElementById('ctrl-p1-score-val').innerText = p1Score;

            // Player 2 - Raw name preserved
            const p2Name = data.p2Name || "Waiting...";
            const p2Hp = data.p2Hp !== undefined ? data.p2Hp : 20;
            const p2Score = data.p2Score !== undefined ? data.p2Score : 0;

            document.getElementById('ctrl-p2-name').innerText = p2Name;
            document.getElementById('ctrl-p2-hp').innerText = `${p2Hp} / 20`;
            document.getElementById('ctrl-p2-score-val').innerText = p2Score;
        });

        // Function to adjust match scores directly in Firebase
        function adjustScore(scoreKey, amount) {
            dbRef.once('value').then((snapshot) => {
                const data = snapshot.val() || {};
                let currentScore = data[scoreKey] !== undefined ? data[scoreKey] : 0;
                let newScore = Math.max(0, currentScore + amount);

                // Update Firebase
                dbRef.update({
                    [scoreKey]: newScore
                });
            });
        }
    </script>
</body>
</html>
