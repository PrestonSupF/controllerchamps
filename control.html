<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs - Admin Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #121216;
            color: #ffffff;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 620px;
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #ffaa00;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .match-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-row {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            color: #aaa;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ffaa00;
        }

        .value-display {
            font-size: 15px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ddd;
        }

        .score-controls {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            background: #ffaa00;
            color: #111;
            border: none;
            padding: 8px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #ffbb22; }

        button.decrement {
            background: #333;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        button.decrement:hover { background: #444; }

        .totem-toggle-btn {
            background: #444;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .totem-toggle-btn.active-totem {
            background: #28a745;
            color: #fff;
            border-color: #32b651;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .save-btn {
            background: #007bff;
            color: #fff;
        }
        .save-btn:hover { background: #1589ff; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Controller Champs Admin</h1>
        <div class="match-card">
            
            <!-- Player 1 Control -->
            <div class="player-row">
                <div class="player-title">Player 1 Control</div>
                <div class="stat-box">
                    <label>Player Name (Supports . prefix for Bedrock)</label>
                    <input type="text" id="p1-name-input" placeholder="e.g. .Redgoesbrr">
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Live HP Readout</label>
                        <div id="ctrl-p1-hp" class="value-display">20 / 20</div>
                    </div>
                    <div class="stat-box">
                        <label>Score Control (<span id="ctrl-p1-score-val" style="color: #ffaa00;">0</span>)</label>
                        <div class="score-controls">
                            <button class="decrement" onclick="adjustScore('p1Score', -1)">-</button>
                            <button onclick="adjustScore('p1Score', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Totem Status Override</label>
                        <button id="p1-totem-toggle" class="totem-toggle-btn" onclick="toggleTotem('p1')">Totem: OFF</button>
                    </div>
                    <div class="stat-box" style="justify-content: flex-end;">
                        <button class="save-btn" onclick="updatePlayerName('p1Name', 'p1-name-input')">Update P1 Name</button>
                    </div>
                </div>
            </div>

            <!-- Player 2 Control -->
            <div class="player-row">
                <div class="player-title">Player 2 Control</div>
                <div class="stat-box">
                    <label>Player Name (Supports . prefix for Bedrock)</label>
                    <input type="text" id="p2-name-input" placeholder="e.g. Steve">
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Live HP Readout</label>
                        <div id="ctrl-p2-hp" class="value-display">20 / 20</div>
                    </div>
                    <div class="stat-box">
                        <label>Score Control (<span id="ctrl-p2-score-val" style="color: #ffaa00;">0</span>)</label>
                        <div class="score-controls">
                            <button class="decrement" onclick="adjustScore('p2Score', -1)">-</button>
                            <button onclick="adjustScore('p2Score', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Totem Status Override</label>
                        <button id="p2-totem-toggle" class="totem-toggle-btn" onclick="toggleTotem('p2')">Totem: OFF</button>
                    </div>
                    <div class="stat-box" style="justify-content: flex-end;">
                        <button class="save-btn" onclick="updatePlayerName('p2Name', 'p2-name-input')">Update P2 Name</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('matchState');

        let isInitialLoad = true;

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (isInitialLoad) {
                if (data.p1Name) document.getElementById('p1-name-input').value = data.p1Name;
                if (data.p2Name) document.getElementById('p2-name-input').value = data.p2Name;
                isInitialLoad = false;
            }

            document.getElementById('ctrl-p1-hp').innerText = `${data.p1Hp !== undefined ? data.p1Hp : 20} / 20`;
            document.getElementById('ctrl-p1-score-val').innerText = data.p1Score !== undefined ? data.p1Score : 0;
            
            const p1TotemBtn = document.getElementById('p1-totem-toggle');
            if (data.p1Totem) {
                p1TotemBtn.innerText = "Totem: ON";
                p1TotemBtn.classList.add('active-totem');
            } else {
                p1TotemBtn.innerText = "Totem: OFF";
                p1TotemBtn.classList.remove('active-totem');
            }

            document.getElementById('ctrl-p2-hp').innerText = `${data.p2Hp !== undefined ? data.p2Hp : 20} / 20`;
            document.getElementById('ctrl-p2-score-val').innerText = data.p2Score !== undefined ? data.p2Score : 0;
            
            const p2TotemBtn = document.getElementById('p2-totem-toggle');
            if (data.p2Totem) {
                p2TotemBtn.innerText = "Totem: ON";
                p2TotemBtn.classList.add('active-totem');
            } else {
                p2TotemBtn.innerText = "Totem: OFF";
                p2TotemBtn.classList.remove('active-totem');
            }
        });

        function updatePlayerName(nameKey, inputId) {
            const nameVal = document.getElementById(inputId).value.trim();
            dbRef.update({ [nameKey]: nameVal });
        }

        function adjustScore(scoreKey, amount) {
            dbRef.once('value').then((snapshot) => {
                const data = snapshot.val() || {};
                let currentScore = data[scoreKey] !== undefined ? data[scoreKey] : 0;
                dbRef.update({ [scoreKey]: Math.max(0, currentScore + amount) });
            });
        }

        function toggleTotem(playerPrefix) {
            dbRef.once('value').then((snapshot) => {
                const data = snapshot.val() || {};
                const currentState = data[playerPrefix + 'Totem'] || false;
                dbRef.update({
                    [playerPrefix + 'Totem']: !currentState,
                    [playerPrefix + 'TotemToggle']: true // Flags manual override
                });
            });
        }
    </script>
</body>
</html>
