<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller Champs | Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1017;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        h1 {
            color: #f5b942;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .panel-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 960px;
        }
        @media (max-width: 768px) {
            .panel-container { grid-template-columns: 1fr; }
        }
        .card {
            background: #161b26;
            border: 2px solid #2a3142;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card h2 {
            font-size: 16px;
            color: #f5b942;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid #2a3142;
            padding-bottom: 10px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        input[type="text"], input[type="number"] {
            background: #0f131c;
            border: 1px solid #363f54;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 14px;
            width: 100%;
        }
        button {
            background: #232a3b;
            border: 1px solid #3b4661;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        button:hover {
            border-color: #f5b942;
            background: #2c354a;
        }
        button.primary {
            background: #f5b942;
            color: #111;
            border-color: #f5b942;
        }
        button.primary:hover {
            background: #ffca5c;
        }
        button.danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #f87171;
        }
        button.danger:hover {
            background: rgba(239, 68, 68, 0.35);
        }
        .kit-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .kit-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            padding: 8px 10px;
            font-size: 12px;
        }
        .kit-btn.active {
            border-color: #f5b942;
            background: rgba(245, 185, 66, 0.2);
            color: #f5b942;
        }
        .kit-btn img {
            width: 18px;
            height: 18px;
            image-rendering: pixelated;
        }
        .veto-status-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }
        .picked-highlight {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>Controller Champs • Admin Panel</h1>

    <div class="panel-container">
        <!-- Manual Gamemode Switcher -->
        <div class="card">
            <h2>Manual Gamemode Override</h2>
            <p style="font-size: 12px; color: #9ba3af;">Click any kit below to immediately update the live stream HUD:</p>
            <div class="kit-buttons" id="manual-kit-grid"></div>
            <div class="row" style="margin-top: 4px;">
                <input type="text" id="custom-gamemode" placeholder="Or type custom kit name (e.g. Crystal (Low Tier))...">
                <button class="primary" onclick="setCustomGamemode()">Set</button>
            </div>
        </div>

        <!-- Veto Draft Management & Reset -->
        <div class="card">
            <h2>Tournament Veto Controls</h2>
            <div class="veto-status-list" id="veto-admin-status">
                Loading veto status...
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
                <button class="danger" onclick="resetVetoOnly()">Reset Veto Draft Only (Keep Players)</button>
                <button class="danger" onclick="resetForNewPlayers()">Full Reset for New Players (Veto + Scores + Names)</button>
            </div>
        </div>

        <!-- Score & Player Management -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>Live Match Players & Scoreboard</h2>
            <div class="row">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-size: 12px; color: #f5b942; font-weight: 700;">PLAYER 1</label>
                    <div class="row">
                        <input type="text" id="admin-p1-name" placeholder="Player 1 Name">
                        <button onclick="updateMatchField('p1Name', document.getElementById('admin-p1-name').value)">Save</button>
                    </div>
                    <div class="row">
                        <button onclick="adjustScore('p1Score', -1)">-1 Score</button>
                        <span id="admin-p1-score" style="font-size: 20px; font-weight: 800;">0</span>
                        <button class="primary" onclick="adjustScore('p1Score', 1)">+1 Score</button>
                    </div>
                </div>

                <div style="width: 2px; height: 80px; background: #2a3142; margin: 0 16px;"></div>

                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-size: 12px; color: #f5b942; font-weight: 700;">PLAYER 2</label>
                    <div class="row">
                        <input type="text" id="admin-p2-name" placeholder="Player 2 Name">
                        <button onclick="updateMatchField('p2Name', document.getElementById('admin-p2-name').value)">Save</button>
                    </div>
                    <div class="row">
                        <button onclick="adjustScore('p2Score', -1)">-1 Score</button>
                        <span id="admin-p2-score" style="font-size: 20px; font-weight: 800;">0</span>
                        <button class="primary" onclick="adjustScore('p2Score', 1)">+1 Score</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        firebase.initializeApp({
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        });

        const db = firebase.database();
        const BEDROCK_BASE = "https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/items";

        const GAMEMODES = [
            { id: "Sword", icon: `${BEDROCK_BASE}/diamond_sword.png` },
            { id: "SMP", icon: `${BEDROCK_BASE}/ender_pearl.png` },
            { id: "Crystal", icon: `${BEDROCK_BASE}/end_crystal.png` },
            { id: "Mace", icon: `${BEDROCK_BASE}/mace.png` },
            { id: "Pot", icon: `${BEDROCK_BASE}/potion_bottle_splash.png` },
            { id: "UHC", icon: `${BEDROCK_BASE}/golden_apple.png` },
            { id: "Diamond SMP", icon: `${BEDROCK_BASE}/chorus_fruit.png` },
            { id: "Spear Mace", icon: `${BEDROCK_BASE}/netherite_sword.png` },
            { id: "Cart", icon: `${BEDROCK_BASE}/tnt_minecart.png` }
        ];

        let matchData = {};

        function setGamemode(mode) {
            db.ref("matchState").update({ gamemode: mode });
        }

        function setCustomGamemode() {
            const val = document.getElementById("custom-gamemode").value.trim();
            if (val) {
                setGamemode(val);
                document.getElementById("custom-gamemode").value = "";
            }
        }

        function updateMatchField(field, value) {
            if (!value.trim()) return;
            db.ref("matchState").update({ [field]: value.trim() });
        }

        function adjustScore(field, delta) {
            const current = Number(matchData[field]) || 0;
            db.ref("matchState").update({ [field]: Math.max(0, current + delta) });
        }

        function resetVetoOnly() {
            db.ref("vetoState").set({
                step: 0,
                kits: {},
                mutualP1: false,
                mutualP2: false
            });
        }

        function resetForNewPlayers() {
            db.ref("vetoState").set({
                step: 0,
                kits: {},
                mutualP1: false,
                mutualP2: false
            });
            db.ref("matchState").update({
                p1Name: "Steve",
                p2Name: "Alex",
                p1Score: 0,
                p2Score: 0
            });
        }

        db.ref("matchState").on("value", (snap) => {
            matchData = snap.val() || {};
            const activeMode = matchData.gamemode || "Sword";

            if (document.activeElement !== document.getElementById("admin-p1-name")) {
                document.getElementById("admin-p1-name").value = matchData.p1Name || "";
            }
            if (document.activeElement !== document.getElementById("admin-p2-name")) {
                document.getElementById("admin-p2-name").value = matchData.p2Name || "";
            }

            document.getElementById("admin-p1-score").innerText = matchData.p1Score ?? 0;
            document.getElementById("admin-p2-score").innerText = matchData.p2Score ?? 0;

            const grid = document.getElementById("manual-kit-grid");
            grid.innerHTML = GAMEMODES.map(g => `
                <button class="kit-btn ${activeMode.toLowerCase() === g.id.toLowerCase() ? 'active' : ''}" onclick="setGamemode('${g.id}')">
                    <img src="${g.icon}" alt="${g.id}">
                    <span>${g.id}</span>
                </button>
            `).join("");
        });

        db.ref("vetoState").on("value", (snap) => {
            const veto = snap.val() || { step: 0, kits: {} };
            const statusBox = document.getElementById("veto-admin-status");
            const kitsMap = veto.kits || {};

            const picked = Object.entries(kitsMap)
                .filter(([_, v]) => v.status === "picked")
                .sort((a, b) => a[1].order - b[1].order);

            let html = `<div><strong>Draft Progress:</strong> Step ${Math.min(veto.step || 0, 9)} / 9</div>`;

            if (picked.length > 0) {
                html += picked.map(([kitName, info], idx) => `
                    <div class="picked-highlight">
                        <span><strong>Duel ${idx + 1}:</strong> ${kitName} (${info.by})</span>
                        <button class="primary" style="padding: 4px 10px; font-size: 11px;" onclick="setGamemode('${kitName}')">Activate on HUD</button>
                    </div>
                `).join("");
            } else {
                html += `<div style="color: #9ba3af;">No duel kits locked in yet.</div>`;
            }

            statusBox.innerHTML = html;
        });
    </script>
</body>
</html>
