<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs - Admin Control Panel</title>
    <!-- Firebase App (Core SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #121216;
            color: #ffffff;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 600px;
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #ffaa00;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .match-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-row {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            color: #aaa;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ffaa00;
        }

        .value-display {
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ddd;
        }

        .score-controls {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            background: #ffaa00;
            color: #111;
            border: none;
            padding: 8px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #ffbb22;
        }

        button.decrement {
            background: #333;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button.decrement:hover {
            background: #444;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .save-btn {
            background: #28a745;
            color: #fff;
        }
        .save-btn:hover {
            background: #32b651;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Controller Champs Admin</h1>
        <div class="match-card">
            
            <!-- Player 1 Control -->
            <div class="player-row">
                <div class="player-title">Player 1 Control</div>
                <div class="stat-box" style="margin-bottom: 8px;">
                    <label>Player Name (Supports . prefix for Bedrock)</label>
                    <input type="text" id="p1-name-input" placeholder="e.g. .Redgoesbrr">
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Live HP Readout</label>
                        <div id="ctrl-p1-hp" class="value-display">20 / 20</div>
                    </div>
                    <div class="stat-box">
                        <label>Score Control (<span id="ctrl-p1-score-val" style="color: #ffaa00;">0</span>)</label>
                        <div class="score-controls">
                            <button class="decrement" onclick="adjustScore('p1Score', -1)">-</button>
                            <button onclick="adjustScore('p1Score', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="action-row">
                    <button class="save-btn" onclick="updatePlayerName('p1Name', 'p1-name-input')">Update Player 1 Name</button>
                </div>
            </div>

            <!-- Player 2 Control -->
            <div class="player-row">
                <div class="player-title">Player 2 Control</div>
                <div class="stat-box" style="margin-bottom: 8px;">
                    <label>Player Name (Supports . prefix for Bedrock)</label>
                    <input type="text" id="p2-name-input" placeholder="e.g. Steve">
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Live HP Readout</label>
                        <div id="ctrl-p2-hp" class="value-display">20 / 20</div>
                    </div>
                    <div class="stat-box">
                        <label>Score Control (<span id="ctrl-p2-score-val" style="color: #ffaa00;">0</span>)</label>
                        <div class="score-controls">
                            <button class="decrement" onclick="adjustScore('p2Score', -1)">-</button>
                            <button onclick="adjustScore('p2Score', 1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="action-row">
                    <button class="save-btn" onclick="updatePlayerName('p2Name', 'p2-name-input')">Update Player 2 Name</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Firebase Configuration for champs-6c8c8
        const firebaseConfig = {
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('matchState');

        let isInitialLoad = true;

        // Listen for real-time updates to populate fields initially or reflect live HP/scores
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Only fill input boxes on first load so typing isn't interrupted by background syncs
            if (isInitialLoad) {
                if (data.p1Name) document.getElementById('p1-name-input').value = data.p1Name;
                if (data.p2Name) document.getElementById('p2-name-input').value = data.p2Name;
                isInitialLoad = false;
            }

            // Update live readouts
            document.getElementById('ctrl-p1-hp').innerText = `${data.p1Hp !== undefined ? data.p1Hp : 20} / 20`;
            document.getElementById('ctrl-p1-score-val').innerText = data.p1Score !== undefined ? data.p1Score : 0;

            document.getElementById('ctrl-p2-hp').innerText = `${data.p2Hp !== undefined ? data.p2Hp : 20} / 20`;
            document.getElementById('ctrl-p2-score-val').innerText = data.p2Score !== undefined ? data.p2Score : 0;
        });

        // Function to push manual name updates to Firebase (retains dots if typed)
        function updatePlayerName(nameKey, inputId) {
            const nameVal = document.getElementById(inputId).value.trim();
            dbRef.update({
                [nameKey]: nameVal
            }).then(() => {
                console.log(`${nameKey} updated to: ${nameVal}`);
            }).catch((error) => {
                alert("Failed to update name: " + error.message);
            });
        }

        // Function to adjust scores directly in Firebase
        function adjustScore(scoreKey, amount) {
            dbRef.once('value').then((snapshot) => {
                const data = snapshot.val() || {};
                let currentScore = data[scoreKey] !== undefined ? data[scoreKey] : 0;
                let newScore = Math.max(0, currentScore + amount);

                dbRef.update({
                    [scoreKey]: newScore
                });
            });
        }
    </script>
</body>
</html>
