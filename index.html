<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs HUD</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .player-card {
            display: flex;
            align-items: center;
            gap: 30px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 20px;
        }
        .player-info-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-name {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }
        .hearts {
            font-size: 20px;
            letter-spacing: 2px;
        }
        .armor-container {
            display: flex;
            gap: 12px;
        }
        .armor-slot {
            background: #1e1e1e;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 45px;
        }
        .armor-slot span {
            font-size: 14px;
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Player 1 HUD Card -->
    <div class="player-card">
        <!-- Left: Name & Hearts Stack -->
        <div class="player-info-stack">
            <h2 class="player-name" id="p1-name">Waiting...</h2>
            <div class="hearts" id="p1-hearts">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
        </div>

        <!-- Right: Armor Slots & Durability Side-by-Side -->
        <div class="armor-container">
            <div class="armor-slot">
                <span id="p1-helmet-name"> Helm </span>
                <span id="p1-helmet-dur">0</span>
            </div>
            <div class="armor-slot">
                <span id="p1-chest-name"> Chest </span>
                <span id="p1-chest-dur">0</span>
            </div>
            <div class="armor-slot">
                <span id="p1-legs-name"> Legs </span>
                <span id="p1-legs-dur">0</span>
            </div>
            <div class="armor-slot">
                <span id="p1-boots-name"> Boots </span>
                <span id="p1-boots-dur">0</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Integration Script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        const dbRef = firebase.database().ref('matchState');
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Update Player 1 Info
            document.getElementById('p1-name').innerText = data.p1Name || "Player 1";
            document.getElementById('p1-helmet-dur').innerText = data.p1HelmetDur || 0;
            document.getElementById('p1-chest-dur').innerText = data.p1ChestDur || 0;
            document.getElementById('p1-legs-dur').innerText = data.p1LegsDur || 0;
            document.getElementById('p1-boots-dur').innerText = data.p1BootsDur || 0;
        });
    </script>
</body>
</html>
