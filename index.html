<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs Stream HUD</title>
    <!-- Firebase App (Core SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: transparent; /* Perfect for OBS transparent browser source */
            color: #ffffff;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .hud-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 740px;
            background: transparent; /* No background wrapper */
            padding: 10px 20px;
        }

        .player-side {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 42%;
        }

        .player-side.p2 {
            flex-direction: row-reverse;
            text-align: right;
        }

        .head-wrapper {
            position: relative;
            width: 55px;
            height: 55px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .head-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            overflow: hidden;
        }

        .player-name {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            color: #ffffff;
        }

        /* Minecraft Hearts Row */
        .hearts-container {
            display: flex;
            gap: 2px;
            height: 14px;
        }

        .player-side.p2 .hearts-container {
            flex-direction: row-reverse;
        }

        .heart {
            width: 12px;
            height: 12px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9"><path fill="%23cc0000" d="M1 0h2v1h1v1h1V1h1V0h2v1h1v2H7v1H6v1H5v1H4V5H3V3H1V1H0V0h1z"/><path fill="%23ff3333" d="M1 1h2v1h1v1H3V1H1z"/><path fill="%23ff9999" d="M1 1h1v1H1z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
        }

        .heart.empty {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9"><path fill="%23330000" d="M1 0h2v1h1v1h1V1h1V0h2v1h1v2H7v1H6v1H5v1H4V5H3V3H1V1H0V0h1z"/><path fill="%23551111" d="M1 1h2v1h1v1H3V1H1z"/></svg>');
        }

        /* Center Score (0 - 0 style with no background) */
        .center-score {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 900;
            color: #ffaa00;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 170, 0, 0.4);
            letter-spacing: 2px;
            padding: 0 10px;
            flex-shrink: 0;
        }

        .score-dash {
            color: #ffffff;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Player 1 -->
        <div class="player-side p1">
            <div class="head-wrapper">
                <img id="p1-head" src="https://api.mcheads.org/head/Steve/64" alt="P1 Head">
            </div>
            <div class="player-info">
                <div id="p1-name" class="player-name">Player 1</div>
                <div id="p1-hearts" class="hearts-container">
                    <!-- Dynamic Hearts -->
                </div>
            </div>
        </div>

        <!-- Center Score Display -->
        <div class="center-score">
            <span id="p1-score">0</span>
            <span class="score-dash">-</span>
            <span id="p2-score">0</span>
        </div>

        <!-- Player 2 -->
        <div class="player-side p2">
            <div class="head-wrapper">
                <img id="p2-head" src="https://api.mcheads.org/head/Alex/64" alt="P2 Head">
            </div>
            <div class="player-info">
                <div id="p2-name" class="player-name">Player 2</div>
                <div id="p2-hearts" class="hearts-container">
                    <!-- Dynamic Hearts -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration for champs-6c8c8
        const firebaseConfig = {
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('matchState');

        // Helper to strip Geyser/Floodgate dot prefix solely for text display
        function sanitizePlayerName(name) {
            if (!name) return "Waiting...";
            return name.startsWith('.') ? name.slice(1) : name;
        }

        // Function to render Minecraft heart elements based on 0-20 HP scale
        function renderHearts(containerId, hp) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            // Clamp HP between 0 and 20
            const currentHp = Math.max(0, Math.min(20, hp));
            const fullHearts = Math.floor(currentHp / 2);
            const hasHalfHeart = (currentHp % 2) !== 0;
            const totalSlots = 10; // Standard 10 hearts

            for (let i = 0; i < totalSlots; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                if (i >= fullHearts && !(i === fullHearts && hasHalfHeart)) {
                    heart.classList.add('empty');
                }
                container.appendChild(heart);
            }
        }

        // Listen for real-time updates from Firebase
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // --- Player 1 Data ---
            const rawP1 = data.p1Name || "Waiting...";
            const cleanP1 = sanitizePlayerName(rawP1);
            const p1Hp = data.p1Hp !== undefined ? data.p1Hp : 20;
            const p1Score = data.p1Score !== undefined ? data.p1Score : 0;

            document.getElementById('p1-name').innerText = cleanP1;
            document.getElementById('p1-score').innerText = p1Score;
            document.getElementById('p1-head').src = `https://api.mcheads.org/head/${encodeURIComponent(rawP1)}/64`;
            renderHearts('p1-hearts', p1Hp);

            // --- Player 2 Data ---
            const rawP2 = data.p2Name || "Waiting...";
            const cleanP2 = sanitizePlayerName(rawP2);
            const p2Hp = data.p2Hp !== undefined ? data.p2Hp : 20;
            const p2Score = data.p2Score !== undefined ? data.p2Score : 0;

            document.getElementById('p2-name').innerText = cleanP2;
            document.getElementById('p2-score').innerText = p2Score;
            document.getElementById('p2-head').src = `https://api.mcheads.org/head/${encodeURIComponent(rawP2)}/64`;
            renderHearts('p2-hearts', p2Hp);
        });
    </script>
</body>
</html>
