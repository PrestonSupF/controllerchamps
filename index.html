<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs Stream HUD</title>
    <!-- Firebase App (Core SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: transparent; /* Perfect for OBS transparent browser source */
            color: #ffffff;
            padding: 30px;
        }

        .hud-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 700px;
            background: rgba(15, 15, 20, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .player-side {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 42%;
        }

        .player-side.p2 {
            flex-direction: row-reverse;
            text-align: right;
        }

        .head-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            flex-shrink: 0;
        }

        .head-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            overflow: hidden;
        }

        .name-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .player-side.p2 .name-score {
            flex-direction: row-reverse;
        }

        .score {
            background: #ffaa00;
            color: #111;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .hp-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff6666);
            transition: width 0.2s ease-in-out;
            border-radius: 4px;
        }

        .vs-badge {
            font-size: 20px;
            font-weight: 900;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Player 1 -->
        <div class="player-side p1">
            <div class="head-wrapper">
                <img id="p1-head" src="https://api.mcheads.org/head/Steve/64" alt="P1 Head">
            </div>
            <div class="player-info">
                <div class="name-score">
                    <span id="p1-name">Player 1</span>
                    <span id="p1-score" class="score">0</span>
                </div>
                <div class="hp-bar-bg">
                    <div id="p1-hp" class="hp-bar-fill" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <div class="vs-badge">VS</div>

        <!-- Player 2 -->
        <div class="player-side p2">
            <div class="head-wrapper">
                <img id="p2-head" src="https://api.mcheads.org/head/Alex/64" alt="P2 Head">
            </div>
            <div class="player-info">
                <div class="name-score">
                    <span id="p2-name">Player 2</span>
                    <span id="p2-score" class="score">0</span>
                </div>
                <div class="hp-bar-bg">
                    <div id="p2-hp" class="hp-bar-fill" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration for champs-6c8c8
        const firebaseConfig = {
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('matchState');

        // Helper to strip Geyser/Floodgate dot prefixes (e.g. ".Redgoesbrr" -> "Redgoesbrr")
        function sanitizePlayerName(name) {
            if (!name) return "Waiting...";
            return name.startsWith('.') ? name.slice(1) : name;
        }

        // Listen for real-time updates from Firebase
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // --- Player 1 Data ---
            const rawP1 = data.p1Name || "Waiting...";
            const cleanP1 = sanitizePlayerName(rawP1);
            const p1Hp = data.p1Hp !== undefined ? data.p1Hp : 20;
            const p1Score = data.p1Score !== undefined ? data.p1Score : 0;

            document.getElementById('p1-name').innerText = cleanP1;
            document.getElementById('p1-score').innerText = p1Score;
            document.getElementById('p1-head').src = `https://api.mcheads.org/head/${encodeURIComponent(cleanP1)}/64`;
            document.getElementById('p1-hp').style.width = `${Math.max(0, Math.min(100, (p1Hp / 20) * 100))}%`;

            // --- Player 2 Data ---
            const rawP2 = data.p2Name || "Waiting...";
            const cleanP2 = sanitizePlayerName(rawP2);
            const p2Hp = data.p2Hp !== undefined ? data.p2Hp : 20;
            const p2Score = data.p2Score !== undefined ? data.p2Score : 0;

            document.getElementById('p2-name').innerText = cleanP2;
            document.getElementById('p2-score').innerText = p2Score;
            document.getElementById('p2-head').src = `https://api.mcheads.org/head/${encodeURIComponent(cleanP2)}/64`;
            document.getElementById('p2-hp').style.width = `${Math.max(0, Math.min(100, (p2Hp / 20) * 100))}%`;
        });
    </script>
</body>
</html>
