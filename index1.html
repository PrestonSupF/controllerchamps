<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Champs HUD</title>
    <style>
        body {
            background-color: transparent;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .match-container {
            display: flex;
            justify-content: space-between;
            width: 900px;
        }
        .player-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(30, 30, 30, 0.85);
            padding: 15px 20px;
            border-radius: 12px;
            width: 400px;
        }
        .player-avatar {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            background: #444;
        }
        .player-info-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }
        .name-and-armor {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-name {
            font-size: 22px;
            font-weight: bold;
            margin: 0;
        }
        .hearts {
            font-size: 16px;
            letter-spacing: 1px;
        }
        /* Armor Layout: Icon on top of text, sitting beside the name */
        .armor-container {
            display: flex;
            gap: 8px;
        }
        .armor-slot {
            background: rgba(20, 20, 20, 0.9);
            padding: 4px 6px;
            border-radius: 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 32px;
        }
        .armor-slot img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }
        .armor-slot span {
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="match-container">
        <!-- Player 1 Card -->
        <div class="player-card">
            <img class="player-avatar" id="p1-avatar" src="" alt="P1 Head">
            <div class="player-info-stack">
                <div class="name-and-armor">
                    <h2 class="player-name" id="p1-name">Player 1</h2>
                    <div class="armor-container" id="p1-armor">
                        <div class="armor-slot"><img id="p1-helmet-img" src=""><span id="p1-helmet-dur">0</span></div>
                        <div class="armor-slot"><img id="p1-chest-img" src=""><span id="p1-chest-dur">0</span></div>
                        <div class="armor-slot"><img id="p1-legs-img" src=""><span id="p1-legs-dur">0</span></div>
                        <div class="armor-slot"><img id="p1-boots-img" src=""><span id="p1-boots-dur">0</span></div>
                    </div>
                </div>
                <div class="hearts" id="p1-hearts">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
            </div>
        </div>

        <!-- Player 2 Card -->
        <div class="player-card">
            <img class="player-avatar" id="p2-avatar" src="" alt="P2 Head">
            <div class="player-info-stack">
                <div class="name-and-armor">
                    <h2 class="player-name" id="p2-name">Player 2</h2>
                    <div class="armor-container" id="p2-armor">
                        <div class="armor-slot"><img id="p2-helmet-img" src=""><span id="p2-helmet-dur">0</span></div>
                        <div class="armor-slot"><img id="p2-chest-img" src=""><span id="p2-chest-dur">0</span></div>
                        <div class="armor-slot"><img id="p2-legs-img" src=""><span id="p2-legs-dur">0</span></div>
                        <div class="armor-slot"><img id="p2-boots-img" src=""><span id="p2-boots-dur">0</span></div>
                    </div>
                </div>
                <div class="hearts" id="p2-hearts">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Integration -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://champs-6c8c8-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        // Helper to format item names into clean asset image URLs
        function getItemTexture(itemName) {
            if (!itemName || itemName === "air" || itemName.includes("air")) return "";
            let formatted = itemName.toLowerCase().replace(/ /g, "_").replace(/"/g, "");
            return `https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.1/item/%{formatted}.png`;
        }

        // Helper to color durability text dynamically from green (#00ff66) to dark red (#8b0000)
        function updateDurabilityColor(elementId, currentDur, maxDur = 500) {
            const el = document.getElementById(elementId);
            el.innerText = currentDur;
            
            let ratio = Math.max(0, Math.min(1, currentDur / maxDur));
            // Simple RGB interpolation from dark red (139, 0, 0) to bright green (0, 255, 102)
            let r = Math.round(139 + (0 - 139) * ratio);
            let g = Math.round(0 + (255 - 0) * ratio);
            let b = Math.round(0 + (102 - 0) * ratio);
            
            el.style.color = `rgb(${r}, ${g}, ${b})`;
        }

        // Helper to generate dynamic Minecraft health hearts
        function renderHearts(hp) {
            let fullHearts = Math.floor(hp / 2);
            let hasHalf = (hp % 2) !== 0;
            let emptyHearts = Math.max(0, 10 - fullHearts - (hasHalf ? 1 : 0));
            
            return '❤️'.repeat(fullHearts) + (hasHalf ? '🧡' : '') + '🖤'.repeat(emptyHearts);
        }

        const dbRef = firebase.database().ref('matchState');
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // --- Player 1 Update ---
            if (data.p1Name && data.p1Name !== "Player 1") {
                document.getElementById('p1-name').innerText = data.p1Name;
                document.getElementById('p1-avatar').src = `https://minotar.net/avatar/${data.p1Name}/55.png`;
            }
            document.getElementById('p1-hearts').innerText = renderHearts(data.p1Hp ?? 20);
            
            document.getElementById('p1-helmet-img').src = getItemTexture(data.p1Helmet);
            document.getElementById('p1-chest-img').src = getItemTexture(data.p1Chest);
            document.getElementById('p1-legs-img').src = getItemTexture(data.p1Legs);
            document.getElementById('p1-boots-img').src = getItemTexture(data.p1Boots);

            updateDurabilityColor('p1-helmet-dur', data.p1HelmetDur || 0);
            updateDurabilityColor('p1-chest-dur', data.p1ChestDur || 0);
            updateDurabilityColor('p1-legs-dur', data.p1LegsDur || 0);
            updateDurabilityColor('p1-boots-dur', data.p1BootsDur || 0);

            // --- Player 2 Update ---
            if (data.p2Name && data.p2Name !== "Player 2") {
                document.getElementById('p2-name').innerText = data.p2Name;
                document.getElementById('p2-avatar').src = `https://minotar.net/avatar/${data.p2Name}/55.png`;
            }
            document.getElementById('p2-hearts').innerText = renderHearts(data.p2Hp ?? 20);
            
            document.getElementById('p2-helmet-img').src = getItemTexture(data.p2Helmet);
            document.getElementById('p2-chest-img').src = getItemTexture(data.p2Chest);
            document.getElementById('p2-legs-img').src = getItemTexture(data.p2Legs);
            document.getElementById('p2-boots-img').src = getItemTexture(data.p2Boots);

            updateDurabilityColor('p2-helmet-dur', data.p2HelmetDur || 0);
            updateDurabilityColor('p2-chest-dur', data.p2ChestDur || 0);
            updateDurabilityColor('p2-legs-dur', data.p2LegsDur || 0);
            updateDurabilityColor('p2-boots-dur', data.p2BootsDur || 0);
        });
    </script>
</body>
</html>
